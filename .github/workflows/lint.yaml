name: Lint

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    env:
      # Follow # shellcheck source=... (installers source lib/*.sh).
      # source-path=SCRIPTDIR is also set in each installer so the helpers
      # resolve next to the script, not from the repo root.
      SHELLCHECK_OPTS: -x
    steps:
      - uses: actions/checkout@v4
      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: './install'
          
  markdownlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run markdownlint
        uses: articulate/actions-markdownlint@v1
        with:
          config: '.markdownlint.json'
          files: '**/*.md'
