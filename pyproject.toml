[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-sdlc-harness"
version = "0.1.0"
description = "A meta-harness for SDLC that creates custom skills and agents for Claude Code, GHCP, Cursor, and AGY."
authors = [
    {name = "mjbvilhena"}
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1.7",
    "pyyaml>=6.0.1"
]

[project.scripts]
harness = "ai_sdlc_harness.cli:main"
